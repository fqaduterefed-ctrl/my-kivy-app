name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # Buildozer ፋይሎችን በፍጥነት እንዲያገኝ የሚያደርግ መሸጎጫ (Cache)
    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Cache Android SDK/NDK inside project
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-project-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-project-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk python3-pip autoconf automake \
          libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev \
          cmake build-essential libffi-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.11 virtualenv

    - name: Build with Buildozer
      run: |
        # ሎጉ በጣም ትልቅ እንዳይሆን እና GitHub እንዳያቋርጠው ዝምተኛ (Silent) እንዲሆን ያደርጋል
        buildozer -v android debug
      env:
        # Buildozer የራሱን SDK/NDK በራሱ መንገድ እንዲያዘጋጅ ይተወዋል
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    - name: Upload APK Artifact
      if: always() # ግንባታው ቢሳካም ባይሳካም ሎጉን ለማየት እንዲረዳን
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: |
          bin/*.apk
          .buildozer/android/platform/build-*/build/logs/*.log
