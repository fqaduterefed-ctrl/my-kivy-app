name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17 (Required by latest Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev gcc g++ make

      - name: Install Python Tools (Latest updates)
        run: |
          pip install --upgrade pip
          pip install cython buildozer kivy

      - name: Set up Android SDK & NDK
        uses: android-actions/setup-android@v3

      - name: Link GitHub Android NDK to Buildozer (Fixes Timeout)
        run: |
          mkdir -p ~/.buildozer/android/platform/
          # በ GitHub ማሽን ላይ ያለውን ዝግጁ NDK በቀጥታ ማገናኘት (7 ደቂቃ የሚፈጀውን ማውረድ ያስቀራል)
          if [ -d "$ANDROID_NDK_LATEST_HOME" ]; then
            ln -sf $ANDROID_NDK_LATEST_HOME ~/.buildozer/android/platform/android-ndk-r25b
          fi

      - name: Force Accept All Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Build with Buildozer
        run: |
          git config --global --add safe.directory '*'
          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES=1
          
          # ስህተት ካለ በግልጽ ለማየት አሁን verbose (-v) እንጠቀማለን
          buildozer -v android debug
          
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
