name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    # ይህ እርምጃ Buildozer ራሱ አውርዶ እንዳይጨናነቅ ቀድሞ አንድሮይድ SDK ያዘጋጃል
    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    # የቆዩ የ Buildozer ስህተቶችን ለማጽዳት Cache መጠቀም
    - name: Cache Buildozer Packages
      uses: actions/cache@v4
      with:
        path: |
          ~/.buildozer
          .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    # ስርዓቱ የሚፈልጋቸውን የሊኑክስ መተግበሪያዎች አስቀድሞ መጫን
    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    # Buildozerን መጫን እና ማሄድ
    - name: Install Buildozer
      run: pip install --upgrade buildozer Cython==3.0.11

    - name: Build with Buildozer
      run: |
        buildozer android clean
        buildozer android debug
