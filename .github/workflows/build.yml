name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Clean Previous Cache
      run: |
        rm -rf ~/.buildozer
        rm -rf .buildozer

    # የ autoreconf ስህተትን በስሩ የሚያጠፋው የመጨረሻው የተሟላ ትዕዛዝ
    - name: Install Dependencies
      run: |
        sudo apt-get update --fix-missing
        sudo apt-get install -y --no-install-recommends git zip unzip openjdk-17-jdk python3-pip autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake build-essential

    - name: Install Buildozer
      run: pip install --upgrade buildozer Cython==3.0.11

    - name: Build with Buildozer
      run: |
        export hostpython=/opt/hostedtoolcache/Python/3.11.*/x64/bin/python
        buildozer android debug
