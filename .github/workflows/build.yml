name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Cache Android SDK/NDK inside project
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-project-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-project-buildozer-

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          git zip unzip openjdk-17-jdk python3-pip autoconf automake \
          libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev \
          cmake build-essential libffi-dev libltdl-dev

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install buildozer cython==3.0.11 virtualenv

    - name: Build with Buildozer
      run: |
        buildozer -v android debug
      env:
        GRADLE_OPTS: "-Dorg.gradle.daemon=false"

    # የትኛው ደረጃ ላይ እንደተሰበረ ለማወቅ ሎግ ፋይሉን ሁልጊዜ እንዲጭን (Upload) እናደርጋለን
    - name: Upload Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: buildozer-error-logs
        path: .buildozer/android/platform/build-arm64-v8a_armeabi-v7a/build/other_builds/python3/arm64-v8a__ndk_target_24/python3/

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: my-android-app
        path: bin/*.apk
