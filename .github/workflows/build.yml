name: Build APK
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up JDK 17 (Required by latest Android SDK)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev gcc g++ make

      - name: Install Python Tools (Latest updates)
        run: |
          pip install --upgrade pip
          pip install cython buildozer kivy

      - name: Set up Android SDK (Required to auto-accept licenses)
        uses: android-actions/setup-android@v3

      - name: Force Accept All Android SDK Licenses
        run: |
          # የሲስተሙን ፍቃዶች በሙሉ በ 'yes' ትዕዛዝ አስገድዶ መቀበል
          yes | sdkmanager --licenses || true
          
          # ለ Buildozer ማውጫዎች ፈቃዶችን አስቀድሞ መፍጠር
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg
          
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          if [ -d "$ANDROID_HOME/licenses" ]; then
            cp -r $ANDROID_HOME/licenses ~/.buildozer/android/platform/android-sdk/
          fi

      - name: Build with Buildozer
        run: |
          git config --global --add safe.directory '*'
          export BUILDOZER_ALLOW_ORG_TEST_DOMAIN=1
          export APP_ANDROID_ACCEPT_SDK_LICENSE=1
          export ANDROID_AUTO_ACCEPT_SDK_LICENSES=1
          # ሁለቱንም አማራጮች በመጠቀም ፍቃዱን ማለፍ
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
